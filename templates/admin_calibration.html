<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动校准 - Save-Restricted-Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <span class="header-icon">🔧</span>
                <h1>自动校准</h1>
            </div>
            <div class="header-actions">
                <button class="menu-toggle" onclick="toggleMenu()" aria-label="菜单">
                    <div class="menu-bar"></div>
                    <div class="menu-bar"></div>
                    <div class="menu-bar"></div>
                </button>
                <div class="menu-dropdown" id="menuDropdown">
                    <a href="/notes" class="menu-item"><span class="menu-item-icon">📝</span>笔记列表</a>
                    <a href="/admin" class="menu-item"><span class="menu-item-icon">⚙️</span>管理设置</a>
                    <a href="/setup" class="menu-item"><span class="menu-item-icon">🛠️</span>Bot 配置</a>
                    <a href="/logout" class="menu-item"><span class="menu-item-icon">🚪</span>退出登录</a>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>自动校准配置</h2>
            <p>用于补齐磁力链接中的文件名信息。</p>

            {% if success %}
            <div class="success-message">{{ success }}</div>
            {% endif %}
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <div class="stats">
                <div class="stat-item"><span class="stat-icon">📦</span><span>总任务 <span class="stat-value">{{ stats.get('total', 0) }}</span></span></div>
                <div class="stat-item"><span class="stat-icon">⏳</span><span>待处理 <span class="stat-value">{{ stats.get('ready_to_process', 0) }}</span></span></div>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label><input type="checkbox" name="enabled" {% if config.get('enabled') %}checked{% endif %}> 启用自动校准</label>
                </div>
                <div class="form-group">
                    <label for="filter_mode">过滤模式</label>
                    <select id="filter_mode" name="filter_mode">
                        <option value="empty_only" {% if config.get('filter_mode') == 'empty_only' %}selected{% endif %}>仅空文件名</option>
                        <option value="all" {% if config.get('filter_mode') == 'all' %}selected{% endif %}>全部校准</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="first_delay">首次延迟（秒）</label>
                    <input type="number" id="first_delay" name="first_delay" value="{{ config.get('first_delay', 600) }}">
                </div>
                <div class="form-group">
                    <label for="max_retries">最大重试次数</label>
                    <input type="number" id="max_retries" name="max_retries" value="{{ config.get('max_retries', 3) }}">
                </div>
                <div class="form-group">
                    <label for="concurrent_limit">并发数</label>
                    <input type="number" id="concurrent_limit" name="concurrent_limit" value="{{ config.get('concurrent_limit', 5) }}">
                </div>
                <div class="form-group">
                    <label for="timeout_per_magnet">单个磁力超时（秒）</label>
                    <input type="number" id="timeout_per_magnet" name="timeout_per_magnet" value="{{ config.get('timeout_per_magnet', 30) }}">
                </div>
                <div class="form-group">
                    <label for="batch_timeout">批次超时（秒）</label>
                    <input type="number" id="batch_timeout" name="batch_timeout" value="{{ config.get('batch_timeout', 300) }}">
                </div>
                <button type="submit" class="btn btn-primary">保存配置</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
